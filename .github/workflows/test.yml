name: test

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/test.yml"
      - "**.zig"
      - "**.zon"
  # No path filter: `test` is a required check, so every PR must report it. The `changes` job
  # skips it (a skipped job counts as passing) when nothing Zig-related changed.
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      zig: ${{ steps.diff.outputs.zig }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Zig changes
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD |
            grep -qE '\.(zig|zon)$|^\.github/workflows/test\.yml$'; then
            echo "zig=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Zero dependencies
        run: grep -q '\.dependencies = \.{}' build.zig.zon

      - name: Grab Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Tests Debug
        run: |
          zig build test --summary all

      # Debug uses the self-hosted backend; LLVM-only miscompiles (e.g. vector narrowing) show up here.
      - name: Tests ReleaseSafe
        run: |
          zig build test -Doptimize=ReleaseSafe --summary all

      - name: Linux modules
        run: |
          zig build check -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseFast

      - name: macOS modules
        run: |
          zig build check -Dtarget=aarch64-macos-none -Doptimize=ReleaseFast

      - name: Windows modules
        run: |
          zig build check -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast

      - name: WebAssembly modules
        run: |
          zig build check -Dtarget=wasm32-freestanding -Doptimize=ReleaseSmall
